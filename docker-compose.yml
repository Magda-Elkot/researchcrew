# Host ports are published on 127.0.0.1 only: Qdrant has no auth, so it must not be
# reachable from the local network.
services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: researchcrew-api:dev
    env_file: .env
    environment:
      # Inside the compose network services are reachable by name, not localhost.
      QDRANT_URL: http://qdrant:6333
      DOCS_MCP_URL: http://docs-mcp:8001/mcp
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
      # SQLite job store (jobs, results, progress events) survives restarts.
      - jobs_db:/app/var
    depends_on:
      qdrant:
        condition: service_healthy
      docs-mcp:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    image: researchcrew-frontend:dev
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  docs-mcp:
    build:
      context: .
      dockerfile: docker/docs-mcp.Dockerfile
    image: researchcrew-docs-mcp:dev
    env_file: .env
    environment:
      # `environment` wins over env_file, so these container-specific values always apply.
      QDRANT_URL: http://qdrant:6333
      DOCS_MCP_HOST: 0.0.0.0
      DOCS_MCP_PORT: "8001"
      MODEL_CACHE_DIR: /models
      # Set HF_HUB_OFFLINE=1 in .env when /models is an existing host cache (no downloads).
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    ports:
      - "127.0.0.1:${DOCS_MCP_HOST_PORT:-8001}:8001"
    volumes:
      - ./data:/app/data:ro
      # A named volume by default (first start downloads bge-m3 into it); set
      # MODEL_CACHE_HOST_DIR to a host Hugging Face hub folder to reuse a downloaded model.
      - ${MODEL_CACHE_HOST_DIR:-model_cache}:/models
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.1
    ports:
      # Host port is configurable in case another Qdrant already uses 6333.
      - "127.0.0.1:${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image has no curl: send a raw HTTP request over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
  model_cache:
  jobs_db:
