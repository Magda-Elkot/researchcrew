services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: researchcrew-api:dev
    env_file: .env
    environment:
      # Inside the compose network Qdrant is reachable by service name, not localhost.
      QDRANT_URL: http://qdrant:6333
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:ro
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.1
    ports:
      # Host port is configurable in case another Qdrant already uses 6333.
      - "${QDRANT_HOST_PORT:-6333}:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # The image has no curl: send a raw HTTP request over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.0\r\n\r\n" >&3 && head -1 <&3 | grep -q " 200"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  qdrant_storage:
