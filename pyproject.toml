[project]
name = "researchcrew"
version = "0.1.0"
description = "Multi-agent research assistant built with CrewAI and MCP."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11.9",
    "pydantic-settings>=2.10",
]

[dependency-groups]
api = [
    "crewai>=1.15.41",
    "crewai-tools[mcp]>=1.15.41",
    "fastapi>=0.162.6",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "litellm",
    "mcp>=1.30.0,<2",
    "openinference-instrumentation-crewai>=1.1.27",
    "openinference-instrumentation-litellm>=0.1.58",
    "prometheus-client>=0.26.0",
    "qdrant-client>=1.20.0",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.5",
]
docs = [
    "mcp>=1.30.0,<2",
    "pymupdf>=2.1",
    "qdrant-client>=1.20.0",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
]
frontend = [
    "httpx>=0.28.1",
    "streamlit>=1.67.0",
]

# CPU-only PyTorch for docs-mcp (embeddings run on CPU; avoids ~2-3 GB of CUDA libs).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
researchcrew = "app.cli:main"
ingest = "mcp_servers.docs_mcp.ingest:main"
docs-mcp = "mcp_servers.docs_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Flat layout: the packages live at the repo root, not under src/.
module-root = ""
module-name = ["app", "mcp_servers"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# The project handles Arabic on purpose; some Arabic letters look like Latin ones to
# RUF001-003 (alef ~ "l", heh ~ "o").
allowed-confusables = ["ا", "ه"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "mcp_servers"]
# PyMuPDF's Document constructor has no type hints; allow calls into it (only that package).
untyped_calls_exclude = ["pymupdf"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
filterwarnings = [
    # Tests use qdrant-client's in-memory mode, which ignores payload indexes (expected).
    "ignore:Payload indexes have no effect in the local Qdrant:UserWarning",
]
